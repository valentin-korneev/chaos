default_install_hook_types: [pre-commit, post-commit]

repos:
  - repo: local
    hooks:
      - id: ruff-meter
        name: Проверка Ruff (корпоративный линтер)
        entry: uv run --locked ruff check --select E9,F .
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit
        name: Bandit (сканер безопасности)
        entry: uv run bandit -c pyproject.toml -r .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: bump-version
        name: Повышение patch-версии
        entry: uv version --bump patch
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]

      - id: amend-version
        name: Добавление версии в commit
        entry: git -c core.hooksPath=.git/no-hooks commit --amend --no-edit pyproject.toml uv.lock"
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
